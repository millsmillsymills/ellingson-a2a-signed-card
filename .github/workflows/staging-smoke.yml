name: Keyless Staging Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # live Sigstore staging calls can hang; cap well under the 6h default
    permissions:
      id-token: write # Sigstore keyless: exchange OIDC for a Fulcio cert
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Keyless-sign against Sigstore staging
        run: |
          uv run ellingson-card sign \
            --in cards/ellingson-agent-card.json \
            --out signed-card.json \
            --keyless --staging
      - name: Verify against staging (SAN match + Rekor required, non-anchored)
        run: |
          uv run ellingson-card verify \
            --in signed-card.json \
            --staging \
            --identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/staging-smoke.yml@${GITHUB_REF}" \
            --oidc-issuer https://token.actions.githubusercontent.com \
            | tee verify-output.txt
          grep -Eq 'rekor log index: [0-9]+' verify-output.txt
